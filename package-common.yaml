ghc-options: -Wall
language: GHC2021
default-extensions:
  - DeriveGeneric
  - LambdaCase
  - OverloadedStrings
  - RecordWildCards
dependencies:
  - base             ^>=4.17 || ^>=4.18 || ^>=4.19 || ^>=4.20
  - aeson            ^>=2.1  || ^>=2.2
  - async            ^>=2.2
  - bytestring       ^>=0.11 || ^>=0.12
  - containers       ^>=0.6  || ^>=0.7
  - stm              ^>=2.5
  - text             ^>=1.2  || ^>=2.0  || ^>=2.1
  - time             ^>=1.12
  - vector           ^>=0.13 || ^>=0.14
